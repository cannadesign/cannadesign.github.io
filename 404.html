<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found · Guilherme Cannalonga</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#0c0c0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0c0d; --bg-alt:#141416; --border:#27272a;
    --text:#f2f2f0; --text-dim:#a6a6ab; --text-faint:#808085;
    --gold:#f2a93b;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter', -apple-system, sans-serif; line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:32px; text-align:center; position:relative; overflow-x:hidden;
  }
  body::after{
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(ellipse 700px 400px at 50% 20%, rgba(242,169,59,0.07), transparent 65%);
  }
  .wrap{position:relative; z-index:1; max-width:520px;}
  h1,h2{font-family:'Space Grotesk', sans-serif; font-weight:600; letter-spacing:-0.02em;}
  .code{
    font-family:'Space Grotesk'; font-size:13px; font-weight:600;
    text-transform:uppercase; letter-spacing:0.14em; color:var(--gold);
    border:1px solid rgba(242,169,59,0.3); background:rgba(242,169,59,0.06);
    padding:6px 14px; border-radius:100px; display:inline-block; margin-bottom:26px;
  }
  h1{font-size:clamp(26px,5vw,40px); line-height:1.15; margin-bottom:18px;}
  p{color:var(--text-dim); font-size:16px; margin-bottom:34px;}
  .ctas{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
  a.btn{
    display:inline-flex; align-items:center; gap:8px; text-decoration:none;
    font-size:14px; font-weight:500; padding:12px 22px; border-radius:10px;
    transition:transform .2s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .btn-primary{background:var(--gold); color:#141414;}
  .btn-primary:hover{background:#ffc766; transform:translateY(-1px); box-shadow:0 10px 28px rgba(242,169,59,0.25);}
  .btn-ghost{border:1px solid var(--border); color:var(--text);}
  .btn-ghost:hover{border-color:var(--text-dim); transform:translateY(-1px);}
  ::selection{background:var(--gold); color:#141414;}
  @media (max-width:480px){
    .ctas{flex-direction:column; align-items:stretch;}
    a.btn{justify-content:center;}
  }
  @media (prefers-reduced-motion:reduce){
    *, *::before, *::after{transition-duration:0.01ms !important;}
  }
</style>
<script defer src="https://cloud.umami.is/script.js" data-website-id="c3e64fd0-ec7d-4fdf-a35f-7e8f77208d02"></script></head>
<body>
  <div class="wrap">
    <span class="code">Error 404</span>
    <h1>This page took a wrong turn.</h1>
    <p>The link you followed doesn't exist, or it moved. The work is all still here though.</p>
    <div class="ctas">
      <a class="btn btn-primary" href="/">Back to the portfolio</a>
      <a class="btn btn-ghost" href="mailto:cannalongadesign@gmail.com">Email me</a>
    </div>
  </div>
</body>
</html>
